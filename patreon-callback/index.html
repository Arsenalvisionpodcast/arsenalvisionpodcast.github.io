<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Returning to ArsenalVision…</title>
</head>
<body>
<!-- Patreon OAuth callback for the ArsenalVision app.

     On Android devices where the verified App Link is active, the OS
     hands the URL straight to the app and this page never renders.
     Everywhere else this is the fallback bounce: forward code+state to
     the app's custom scheme. The visible link matters — browsers can
     suppress SCRIPTED external-protocol launches when no user gesture
     is attributed to the navigation, and a real tap always works. -->
<p style="font-family: sans-serif; text-align: center; margin-top: 3em;">
  Returning you to the ArsenalVision app…<br><br>
  <a id="open" href="avpapp://patreon-callback"
     style="font-size: 1.2em;">Tap here if nothing happens</a>
</p>
<script>
  var target = "avpapp://patreon-callback" + window.location.search;
  document.getElementById("open").setAttribute("href", target);
  window.location.replace(target);
</script>
</body>
</html>
